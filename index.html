<style>
:root{--bg:#f4f5fb;--card:#fff;--ink:#1d2140;--mute:#7a7f9a;--key:#e6e8f5;--acc:#5b5bf0;--ok:#22a36b;--bad:#e5484d;--bar:#5b5bf0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12142a;--card:#1c1f3d;--ink:#eef0ff;--mute:#9aa0c4;--key:#2a2e55;--acc:#8b8bff;--ok:#3ccf91;--bad:#ff6b70;--bar:#8b8bff}}
:root[data-theme="dark"]{--bg:#12142a;--card:#1c1f3d;--ink:#eef0ff;--mute:#9aa0c4;--key:#2a2e55;--acc:#8b8bff;--ok:#3ccf91;--bad:#ff6b70;--bar:#8b8bff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;padding:0 16px 16px}
#track{height:14px;background:var(--key);border-radius:0 0 10px 10px;overflow:hidden;margin:0 -16px}
#bar{height:100%;width:100%;background:var(--bar);transition:background .3s}
#hud{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;font-weight:600;font-size:15px}
#back{border:0;background:var(--key);color:var(--ink);border-radius:10px;width:36px;height:32px;font-size:18px;font-family:inherit}
#stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;text-align:center}
#q{font-size:clamp(40px,12vw,56px);font-weight:700;letter-spacing:1px}
#sub{height:20px;margin-top:4px;color:var(--mute);font-size:15px}
#ans{margin-top:10px;min-width:140px;height:64px;border-radius:16px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:700;padding:0 20px;border:3px solid transparent}
#ans.ok{border-color:var(--ok);color:var(--ok)}
#ans.bad{border-color:var(--bad);color:var(--bad)}
#msg{height:22px;margin-top:10px;color:var(--mute);font-size:14px}
#pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
#pad button{height:clamp(52px,9vh,68px);border:0;border-radius:16px;background:var(--key);color:var(--ink);font-size:26px;font-weight:700;font-family:inherit;touch-action:manipulation}
#pad button:active{transform:scale(.95);background:var(--acc);color:#fff}
#pad .fn{font-size:20px;color:var(--mute)}
#pad .okb{background:var(--acc);color:#fff}
#ov{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
#ov.hide{display:none}
#box{max-width:360px;width:100%;text-align:center}
#box h1{margin:0 0 6px;font-size:28px}
#box p{margin:6px 0 16px;color:var(--mute);line-height:1.4}
.mode{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;background:var(--card);color:var(--ink);border-radius:18px;padding:16px;margin-bottom:12px;font-family:inherit;font-size:17px;box-shadow:0 1px 0 var(--key)}
.mode:active{transform:scale(.98)}
.mode .ic{font-size:30px}
.mode small{display:block;color:var(--mute);font-size:13px;margin-top:3px;font-weight:400}
.btn{border:0;background:var(--acc);color:#fff;font-size:17px;font-weight:700;padding:14px 28px;border-radius:14px;font-family:inherit;margin:6px}
.btn.alt{background:var(--key);color:var(--ink)}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake .3s}
#fig{width:min(100%,300px);height:150px;display:none;margin-bottom:4px}
#fig svg{width:100%;height:100%}
.sh{fill:var(--key);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.dl{stroke:var(--mute);stroke-width:1.5;stroke-dasharray:4 3}
.tk,.rm{stroke:var(--ink);stroke-width:2;fill:none}
.tx{fill:var(--ink);font:600 14px system-ui,sans-serif}
.tx.q{fill:var(--acc);font-size:22px}
.logo{display:block;width:100%;max-width:340px;height:auto;margin:36px auto 8px}
#ov{align-items:flex-start}
#box{margin:auto}
.wr{background:var(--card);border-radius:14px;padding:12px;margin:8px 0;text-align:left;font-size:15px;line-height:1.5}
.wr svg{width:100%;max-width:200px;height:auto;display:block;margin:0 auto 6px}
.wr .wq span{color:var(--mute);font-size:13px}
.wr .u{color:var(--bad)}
.wr .c{color:var(--ok)}
#bars{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;width:44px;height:44px;border:0;border-radius:12px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;z-index:5;padding:0}
#bars i{display:block;width:22px;height:3px;border-radius:2px;background:var(--ink)}
#stp{position:fixed;top:calc(env(safe-area-inset-top,0px) + 64px);right:14px;width:min(320px,calc(100vw - 28px));max-height:calc(100% - 90px);overflow:auto;background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:0 8px 30px rgba(0,0,0,.25);text-align:left;z-index:5;font-size:14px;display:none}
#stp.open{display:block}
#stp h3{margin:0 0 8px;font-size:16px}
#stp .row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--key)}
#stp .row span{color:var(--mute);text-align:right}
#stp .tot{margin-top:12px;font-weight:700;display:flex;justify-content:space-between}
#stp .thx{margin-top:12px;text-align:center;color:var(--mute)}
.nick{width:100%;border:0;border-radius:12px;padding:12px 14px;background:var(--card);color:var(--ink);font:inherit;font-size:16px;margin:0 0 12px;text-align:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}
.chip{flex:none;border:0;border-radius:999px;padding:8px 14px;background:var(--key);color:var(--ink);font:inherit;font-size:14px}
.chip.on{background:var(--acc);color:#fff}
.rk{text-align:left;margin-bottom:12px;color:var(--mute)}
.rr{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:6px;color:var(--ink);font-size:14px}
.rr .rn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rr span:last-child{color:var(--mute);font-size:13px}
.rr.me{outline:2px solid var(--acc)}
.sbst{margin:8px 0;font-size:14px;color:var(--mute)}
#rkbtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:14px;height:44px;padding:0 16px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:inherit;font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px;z-index:5;box-shadow:0 4px 14px rgba(91,91,240,.4)}
#rkbtn:active{transform:scale(.96)}
#box #rank{background:var(--acc);color:#fff;box-shadow:0 4px 14px rgba(91,91,240,.35)}
#box #rank small{color:rgba(255,255,255,.85)}
.rkn{margin:0 0 10px;color:var(--mute);font-size:13px;text-align:left;line-height:1.4}
.pod{display:flex;align-items:flex-end;gap:8px;margin:4px 0 14px}
.pc{flex:1;min-width:0;border-radius:14px 14px 4px 4px;padding:10px 6px;text-align:center}
.pc.p1{min-height:160px;background:linear-gradient(#ffd54a,#f5a623);color:#3b2a00;box-shadow:0 6px 18px rgba(245,166,35,.45)}
.pc.p2{min-height:132px;background:linear-gradient(#eef1f6,#b8c0cc);color:#1d2530}
.pc.p3{min-height:112px;background:linear-gradient(#efb48a,#b96f3b);color:#2e1604}
.pc.me{outline:3px solid var(--acc)}
.pc .md{font-size:30px;line-height:1.2}
.pc.p1 .md{font-size:40px}
.pc .pn{font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .pp{font-weight:700;font-size:14px;margin-top:2px}
.pc .ps{font-size:11px;opacity:.8;margin-top:2px}
body.hard{--bg:#16050a;--card:#2b0a12;--ink:#ffeceb;--mute:#e0a3a6;--key:#4d1119;--acc:#ff3b3b;--bar:#ff3b3b;--ok:#4be39b;--bad:#ffd23f}
body.hard #track{height:22px;border-radius:0;background:#2b0a12;border-bottom:2px solid var(--acc)}
body.hard #bar{background-image:repeating-linear-gradient(-45deg,rgba(0,0,0,.3) 0 10px,transparent 10px 20px)!important}
body.hard #hud{text-transform:uppercase;letter-spacing:1.5px;font-size:13px;border-bottom:1px solid var(--key);margin-bottom:6px}
body.hard #back{border-radius:3px;background:var(--acc);color:#fff}
body.hard #stage{background:repeating-linear-gradient(45deg,transparent 0 14px,rgba(255,59,59,.06) 14px 28px);border:1px solid var(--key);border-radius:6px;margin-bottom:10px}
body.hard #q{font-weight:800;text-shadow:0 0 18px rgba(255,59,59,.55)}
body.hard #ans:not(.ok):not(.bad){border-color:var(--acc);border-radius:4px;background:#0f0306}
body.hard #pad{background:#2b0a12;padding:10px;border:2px solid var(--acc);border-radius:6px}
body.hard #pad button{border-radius:4px;border-bottom:4px solid rgba(0,0,0,.45)}
body.hard #box h1{color:var(--acc);text-transform:uppercase;letter-spacing:3px}
body.hard .mode{border-radius:4px;border-left:6px solid var(--acc)}
#box #hard{background:#2b0a12;color:#ffeceb;border:2px solid #ff3b3b}
#box #hard small{color:#e0a3a6}
</style>

var lastTy={};
function pickTy(key,n){var t;do{t=Math.max(rnd(0,n-1),rnd(0,n-1))}while(n>1&&t===lastTy[key]);lastTy[key]=t;return t;}
var lastOp='';
function makeOps(){
  var ops=['+','−'];
  if(level>=2)ops.push('×');
  if(level>=4)ops.push('÷');
  var op;do{op=ops[rnd(0,ops.length-1)]}while(ops.length>1&&op===lastOp);
  lastOp=op;
  var a,b,r,m=8+level*6,k=Math.min(2+level,12);
  if(op==='+'){a=rnd(2,m);b=rnd(2,m);r=a+b}
  else if(op==='−'){a=rnd(3,m);b=rnd(1,a-1);r=a-b}
  else if(op==='×'){a=rnd(2,k);b=rnd(2,k);r=a*b}
  else{b=rnd(2,k);r=rnd(2,k);a=b*r}
  return {t:a+' '+op+' '+b,r:r,s:'',time:mode==='hardA'?10000:undefined};
}
function makeEq1(){
  var n=Math.min(level,5),ty=pickTy('eq1',n),x=rnd(1,4+level*2),a=rnd(2,3+level),b=rnd(1,5+level*3),t;
  if(ty===0)t='x + '+b+' = '+(x+b);
  else if(ty===1)t=a+'x = '+(a*x);
  else if(ty===2)t=a+'x + '+b+' = '+(a*x+b);
  else if(ty===3){b=rnd(1,a*x-1);t=a+'x − '+b+' = '+(a*x-b)}
  else{a=rnd(3,4+level);var c=rnd(1,a-1);b=rnd(1,5+level*2);t=a+'x + '+b+' = '+(c>1?c:'')+'x + '+(b+(a-c)*x)}
  return {t:t,r:x,s:'x = ?',time:(mode==='hardA'?15000:25000)+(ty>=3?5000:0)};
}
function makeEq2(){
  var k=Math.min(3+level,12),r1=rnd(1,k),r2=level>=3?rnd(-Math.min(level+1,9),k):rnd(1,k),
  a=level>=5?rnd(2,3):1,s=r1+r2,p=r1*r2;
  return {t:(a>1?a:'')+'x²'+term(-a*s,'x')+term(a*p,'')+' = 0',r:Math.max(r1,r2),s:r2<0?'Uma raiz é negativa: digite a positiva':'Digite qualquer uma das raízes',all:[r1,r2].filter(function(v){return v>=0}).map(String),show:r1===r2?String(r1):r1+' e '+(r2<0?'−'+(-r2):r2),time:(mode==='hardA'?20000:25000)+(r2<0||a>1?5000:0)};
}

var TRI='30,110 190,110 30,25',RM='<polyline class="rm" points="30,98 42,98 42,110"/>';
function makeArea(){
  var ty=pickTy('area',Math.min(level,5)),k=4+level*3,b=rnd(2,k),h=rnd(2,k),r,f,s;
  if(ty===0){if(b*h%2)h++;r=b*h/2;s='Triângulo';
    f=S(P('30,110 190,110 120,20')+L(120,20,120,110)+T(110,128,'b = '+b)+T(126,70,'h = '+h,'start'))}
  else if(ty===1){r=b*h;s='Retângulo';
    f=S(P('30,30 160,30 160,100 30,100')+T(95,120,'b = '+b)+T(168,70,'h = '+h,'start'))}
  else if(ty===2){r=b*h;s='Paralelogramo';
    f=S(P('20,100 150,100 190,30 60,30')+L(60,30,60,100)+T(85,120,'b = '+b)+T(66,70,'h = '+h,'start'))}
  else if(ty===3){var t=Math.max(1,level-3),mx=Math.min(6+t*2,24),hm=Math.min(3+t,14),B=rnd(4,mx),c=rnd(2,B-2);h=rnd(2,hm);if(t<4){if((B+c)%2)c=c>2?c-1:c+1}else if((B+c)%2&&h%2)h++;r=(B+c)*h/2;s='Trapézio';
    f=S(P('20,100 200,100 150,30 70,30')+L(70,30,70,100)+T(110,120,'B = '+B)+T(110,22,'b = '+c)+T(76,70,'h = '+h,'start'))}
  else{if(b*h%2)h++;r=b*h/2;s='Losango';
    f=S(P('110,15 200,67 110,119 20,67')+L(20,67,200,67)+L(110,15,110,119)+T(160,60,'D = '+b)+T(116,40,'d = '+h,'start'))}
  return {t:'Área = ?',r:r,s:s,f:f};
}
function makeTri(){
  var ty=pickTy('tri',Math.min(level,5)),r,f,s,a,x,t;
  if(ty===0){a=rnd(30,80);var b=rnd(30,80);r=180-a-b;s='Soma dos ângulos';
    f=S(P('30,110 190,110 110,20')+T(58,102,a+'°')+T(162,102,b+'°')+T(110,56,'?','middle','q'))}
  else if(ty===1){
    var I=P('40,110 180,110 110,20')+'<line class="tk" x1="71" y1="62" x2="79" y2="68"/><line class="tk" x1="141" y1="68" x2="149" y2="62"/>';
    if(rnd(0,1)){a=2*rnd(10,60);r=(180-a)/2;s='Isósceles · ângulo da base';f=S(I+T(110,56,a+'°')+T(66,102,'?','middle','q'))}
    else{a=rnd(25,80);r=180-2*a;s='Isósceles · ângulo do vértice';f=S(I+T(66,102,a+'°')+T(154,102,a+'°')+T(110,56,'?','middle','q'))}}
  else if(ty===2){x=rnd(20,70);r=90-x;s='Triângulo retângulo';
    f=rnd(0,1)?S(P(TRI)+RM+T(156,102,x+'°')+T(50,58,'?','start','q')):S(P(TRI)+RM+T(50,58,x+'°','start')+T(156,102,'?','middle','q'))}
  else{t=[[3,4,5],[6,8,10],[5,12,13],[8,15,17],[7,24,25],[9,12,15],[12,16,20],[20,21,29]][rnd(0,7)];
    var u=ty===3?2:rnd(0,1),la=u===0?'?':t[0],lb=u===1?'?':t[1],lc=ty===3?'?':t[2];
    r=ty===3?t[2]:t[u];s=ty===3?'Pitágoras · hipotenusa':'Pitágoras · cateto';
    f=S(P(TRI)+RM+T(110,128,la,'middle',u===0?'q':'')+T(24,70,lb,'end',u===1?'q':'')+T(132,48,lc,'start',ty===3?'q':''))}
  return {t:'x = ?',r:r,s:s,f:f,time:ty<=2?30000:20000};
}
function gcd(a,b){return b?gcd(b,a%b):a}
function makePct(){
  var ty=pickTy('pct',Math.min(level,7)),L=level,p,st,b,q,s,r;
  function pick(a){p=a[rnd(0,a.length-1)];st=100/gcd(p,100)}
  var BIG=[10,20,25,40,50,60,75,80,5,15,30,35,45];
  if(ty===0){pick([10,50]);b=st*rnd(1,5+L*2);r=b*p/100;q=p+'% de '+b;s='Quanto é?'}
  else if(ty===1){pick([20,25,75,40,60,10,50]);b=st*rnd(2,6+L*2);r=b*p/100;q=p+'% de '+b;s='Quanto é?'}
  else if(ty===2){p=5*rnd(1,19);st=100/gcd(p,100);b=st*rnd(1,3+L);r=b*p/100;q=p+'% de '+b;s='Quanto é?'}
  else if(ty===3){pick([10,20,25,50,15,30,5]);b=st*rnd(2,4+L);r=b+b*p/100;q=b+' + '+p+'%';s='Valor após o aumento'}
  else if(ty===4){pick([10,20,25,50,15,30,5,40]);b=st*rnd(2,4+L);r=b-b*p/100;q=b+' − '+p+'%';s='Valor após o desconto'}
  else if(ty===5){pick(BIG);b=st*rnd(1,3+L);r=p;q=(b*p/100)+' = ?% de '+b;s='Quantos por cento?'}
  else{pick(BIG);b=st*rnd(2,4+L);r=b;q=p+'% de x = '+(b*p/100);s='Descubra x'}
  return {t:q,r:r,s:s,time:(mode==='hardA'?15000:20000)+(ty>=3?5000:0)};
}
function next(){
  var md=mode,lv=level;
  if(mode==='hardA'){var ts=['ops','eq1','eq2','pct'].slice(0,Math.min(level,4));md=ts[qn++%ts.length];level=Math.max(1,level-(md==='eq1'?1:md==='eq2'?2:md==='pct'?3:0))}
  if(mode==='hardG'){var tg=['geoA','geoT'].slice(0,Math.min(level,2));md=tg[qn++%tg.length];level=Math.max(1,level-(md==='geoT'?1:0))}
  var p=md==='ops'?makeOps():md==='eq1'?makeEq1():md==='eq2'?makeEq2():md==='pct'?makePct():md==='geoA'?makeArea():makeTri();
  level=lv;cur=p;
  answer=String(p.r);answers=p.all||[answer];show=p.show||answer;qEl.textContent=p.t;subEl.textContent=p.s;
  figEl.innerHTML=p.f||'';figEl.style.display=p.f?'block':'none';
  TIME=p.time||MODES[md].time;

  input='';render();aEl.className='';msg.textContent='';
  locked=false;start=performance.now();cancelAnimationFrame(raf);tick();
}
function tick(){
  var left=TIME-(performance.now()-start);
  if(left<=0){bar.style.width='0%';return miss(true)}
  bar.style.width=(left/TIME*100)+'%';
  bar.style.background=left<TIME*0.3?'var(--bad)':'var(--bar)';
  raf=requestAnimationFrame(tick);
}
function render(){aEl.textContent=input||'\u00a0'}
function hud(){
  lvEl.textContent=level;scEl.textContent=score;

function press(k){
  if(locked)return;
  if(k==='⌫'){input=input.slice(0,-1)}
  else if(k==='OK'){if(input)check();return}
  else if(input.length<Math.max.apply(null,answers.map(function(x){return x.length}))+1){input+=k}
  render();
}
var AC=null;
function playOk(){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    var t=AC.currentTime;
    [[784,0],[1047,0.11],[1319,0.22]].forEach(function(n){
      var o=AC.createOscillator(),g=AC.createGain();
      o.type='triangle';o.frequency.value=n[0];
      g.gain.setValueAtTime(0.0001,t+n[1]);
      g.gain.exponentialRampToValueAtTime(0.25,t+n[1]+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+n[1]+0.35);
      o.connect(g);g.connect(AC.destination);
      o.start(t+n[1]);o.stop(t+n[1]+0.4);
    });
  }catch(e){}
}
function check(){
  if(answers.indexOf(input)>=0){
    playOk();
    locked=true;cancelAnimationFrame(raf);
    var left=Math.max(0,TIME-(performance.now()-start));
    score+=10*level+Math.round(left/1000);
    hits++;aEl.className='ok';
    var up=hits%(grp(mode)==='hard'?3:5)===0;
    if(up){level++;msg.textContent='🎉 Nível '+level+'!'}
    hud();
    setTimeout(next,up?900:450);
  }else miss(false);
}
function miss(timeout){
  wrong.push({t:cur.t,s:cur.s,f:cur.f,r:show,u:input,timeout:timeout});
  locked=true;cancelAnimationFrame(raf);
  lives--;hud();aEl.className='bad shake';
  msg.textContent=(timeout?'⏰ Tempo esgotado. ':'')+(show.indexOf(' e ')>0?'Raízes: ':'Resposta: ')+show;
  if(lives<=0)setTimeout(over,1400);else setTimeout(next,1400);
}

var BADWORDS=['merda','bosta','caralho','cacete','porra','puta','puto','putinha','putona','buceta','boceta','cu','cuzao','cuzinho','arrombado','arrombada','corno','corna','desgraca','desgracado','piranha','vagabundo','vagabunda','otario','otaria','babaca','escroto','escrota','xota','xoxota','punheta','siririca','viado','veado','bicha','sapatao','traveco','viadagem','fdp','pqp','vtnc','vsf','pnc','tnc','foder','fodase','fodido','foda','retardado','retardada','pentelho','canalha','safado','safada','prostituta','boquete','penis','vagina','nazista','racista','estupro','estuprador'];
function normWord(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[\s._*-]/g,'').replace(/(.)\1+/g,'$1');}
var BADSET={};BADWORDS.forEach(function(w){BADSET[normWord(w)]=1});
function mask(t){return '*'.repeat(t.replace(/[\s._*-]/g,'').length||1);}
function censor(s){s=String(s||'');if(BADSET[normWord(s)])return mask(s);return s.replace(/\p{L}+/gu,function(tok){return BADSET[normWord(tok)]?mask(tok):tok;});}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return '&#'+c.charCodeAt(0)+';'})}
function sbFetch(path,opts){

  opts.headers=Object.assign({apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},opts.headers||{});
  return fetch(SB_URL+'/rest/v1/'+path,opts);
}

}

    h+='<button class="mode" data-m="'+k+'"><span class="ic">'+m.icon+'</span><span><b>'+m.name+'</b><small>'+m.desc+'<br>'+(m.tl||(m.time/1000)+' s por questão')+'<br>🏆 Recorde: <b>'+b+'</b> pontos · <b>'+getBestH(k)+'</b> acertos</small></span></button>';
  });
  h+=sub?'<button class="btn alt" id="gback">← Menu</button>':'<button class="mode" id="geo"><span class="ic">📐</span><span><b>Geometria</b><small>Áreas e triângulos com figuras</small></span></button><button class="mode" id="hard"><span class="ic">💀</span><span><b>Hard</b><small>Modos brutais: tudo misturado</small></span></button>'+(SB_OK?'<button class="mode" id="rank"><span class="ic">🏅</span><span><b>Ranking</b><small>Pódio dos modos brutais e top 10 de cada modo</small></span></button>':'');
  if(!sub)h+=statsHtml();
  box.innerHTML=h;
  box.querySelectorAll('.mode[data-m]').forEach(function(b){b.onclick=function(){begin(b.getAttribute('data-m'))}});
  var g=document.getElementById('geo');if(g)g.onclick=function(){menu('geo')};
  var hd=document.getElementById('hard');if(hd)hd.onclick=function(){menu('hard')};
  var gb=document.getElementById('gback');if(gb)gb.onclick=function(){menu()};
  var sb=document.getElementById('bars');if(sb)sb.onclick=function(){document.getElementById('stp').classList.toggle('open')};
  var go=function(){rankMenu('main')};var rk=document.getElementById('rank');if(rk)rk.onclick=go;var rb=document.getElementById('rkbtn');if(rb)rb.onclick=go;
  var ni=document.getElementById('nick');if(ni)ni.oninput=function(){ni.value=censor(ni.value.replace(/[&<>"']/g,''));setNick(ni.value)};
  ov.classList.remove('hide');
}
function begin(m){
  mode=m;document.body.classList.toggle('hard',grp(m)==='hard');TIME=MODES[m].time;level=1;qn=0;wrong=[];playing=true;score=0;lives=2;hits=0;hud();
  ov.classList.add('hide');next();
}
menu();
})();
</script>
</body>
</html>
